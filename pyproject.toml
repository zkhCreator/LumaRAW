[project]
name = "lumaraw-native"
version = "0.4.0"
description = "Portable RAW engine, shared desktop service, CLI and MCP"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "licenses/**/*"]
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = ["rawpy>=0.25,<0.28", "numpy>=2.2,<3", "Pillow>=11,<13", "tifffile>=2025.1", "psutil>=6,<8", "scipy>=1.15,<2", "jsonschema>=4.23,<5"]
[dependency-groups]
dev = ["pytest>=8,<10", "pyinstaller==6.22.3", "PySide6>=6.8,<7"]
[project.scripts]
lumaraw = "lumaraw.bridge:main"
lumaraw-mcp = "lumaraw.mcp:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["lumaraw"]
[tool.pytest.ini_options]
testpaths = ["tests"]
